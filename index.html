<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#11121d"><title>世界斗士 · 街机格斗</title><link rel="stylesheet" href="style.css"></head>
<body><main class="shell"><header><div class="brand">WORLD <b>FIGHTERS</b><small>世界斗士 · 街机格斗</small></div><div id="round-label">选择斗士</div></header>
<section class="arena"><div class="hud"><div class="fighter-hud"><span id="p-name">斗士</span><div class="health"><i id="p-health"></i></div><div class="energy"><i id="p-energy"></i></div></div><div class="timer" id="timer">60</div><div class="fighter-hud right"><span id="e-name">对手</span><div class="health"><i id="e-health"></i></div><div class="energy"><i id="e-energy"></i></div></div></div><canvas id="game" width="960" height="540" aria-label="双人格斗游戏画面"></canvas><div class="banner" id="banner" hidden></div>
<div class="overlay" id="overlay"><div class="panel"><div class="eyebrow">WORLD FIGHTERS / ARCADE</div><h1 id="menu-title">选择你的斗士</h1><p id="menu-text">来自四个国家的斗士，各有专属招式。选择角色，挑战电脑对手。</p><div class="roster" id="roster"></div><button id="start" type="button">开始对战</button><p class="help">电脑：A/D 移动 · W 跳跃 · S 防御 · J 轻击 · K 重击 · L 特技<br>手机：使用屏幕下方按钮</p></div></div></section>
<div class="controls" id="controls"><div class="pad"><button data-key="left" aria-label="向左">◀</button><button data-key="right" aria-label="向右">▶</button><button data-key="jump" aria-label="跳跃">跳</button><button data-key="block" aria-label="防御">防</button></div><div class="attacks"><button data-key="light" aria-label="轻击">轻击</button><button data-key="heavy" aria-label="重击">重击</button><button data-key="special" aria-label="特技">特技</button></div></div><footer>先赢两回合获胜 <span>原创角色 · 手机横屏体验更佳</span></footer></main><script src="game.js"></script></body></html>
